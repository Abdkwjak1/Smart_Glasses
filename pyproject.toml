[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-glasses"
version = "1.0.0"
description = "Voice-driven smart glasses for visually impaired people: object, face and Arabic text recognition with a full Arabic speech interface."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python>=4.8",
]

[project.optional-dependencies]
speech = ["gTTS>=2.5", "SpeechRecognition>=3.10", "PyAudio>=0.2.14", "playsound==1.2.2", "keyboard>=0.13"]
ocr = ["ArabicOcr"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]


[project.scripts]
smart-glasses = "smart_glasses.cli:main"

[tool.setuptools.packages.find]
include = ["smart_glasses*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ui: tests of the visual HUD and the spoken-dialogue interface",
    "perf: performance budgets for the hot paths",
    "integration: needs the sample video and/or the YOLO model files",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
