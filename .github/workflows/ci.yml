name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install opencv-contrib-python-headless pytest pytest-cov ruff && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=smart_glasses
